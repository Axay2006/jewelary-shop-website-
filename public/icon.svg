<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#131314" rx="100"/>
  <!-- Aura Ambient Glow -->
  <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#f2ca50" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#131314" stop-opacity="0"/>
  </radialGradient>
  <circle cx="256" cy="256" r="220" fill="url(#goldGlow)"/>
  
  <!-- Outer Diamond Facets -->
  <g stroke="#f2ca50" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer Diamond Shape -->
    <polygon points="256,70 410,190 256,430 102,190" stroke="#f2ca50" fill="#1c1b1c" fill-opacity="0.5"/>
    
    <!-- Table Line -->
    <line x1="170" y1="190" x2="342" y2="190" stroke="#f2ca50"/>
    
    <!-- Facet Lines from Top to Girdle -->
    <line x1="256" y1="70" x2="170" y2="190"/>
    <line x1="256" y1="70" x2="342" y2="190"/>
    
    <!-- Facet Lines from Girdle to Culet -->
    <line x1="170" y1="190" x2="256" y2="430"/>
    <line x1="342" y1="190" x2="256" y2="430"/>
  </g>
  
  <!-- Central Diamond Accent Dot -->
  <circle cx="256" cy="250" r="14" fill="#f2ca50"/>
  
  <!-- Subtle Sparkle Stars -->
  <path d="M 400 110 Q 400 130 420 130 Q 400 130 400 150 Q 400 130 380 130 Q 400 130 400 110 Z" fill="#ffe088"/>
  <path d="M 110 370 Q 110 385 125 385 Q 110 385 110 400 Q 110 385 95 385 Q 110 385 110 370 Z" fill="#ffe088" opacity="0.8"/>
</svg>
